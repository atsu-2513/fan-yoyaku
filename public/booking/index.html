<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>hair salon FAN | 予約</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>hair salon FAN</h1>
      <p>ご予約フォーム</p>
    </header>

    <div id="error-screen" class="screen" hidden>
      <p class="message message--error">
        予約用のリンクが無効か、有効期限が切れています。<br />
        お手数ですが、LINEでもう一度「予約」と送信してください。
      </p>
    </div>

    <div id="form-screen" class="screen" hidden>
      <ol class="steps">
        <li id="step-indicator-1" class="steps__item is-active">1. 担当者</li>
        <li id="step-indicator-2" class="steps__item">2. 日時</li>
        <li id="step-indicator-3" class="steps__item">3. メニュー</li>
        <li id="step-indicator-4" class="steps__item">4. お客様情報</li>
      </ol>

      <!-- Step 1: 担当者選択 -->
      <section id="step-1" class="step is-active">
        <h3>指名するスタッフを選んでください</h3>
        <div id="staff-options" class="menu-options"></div>
      </section>

      <!-- Step 2: 日時選択 -->
      <section id="step-2" class="step">
        <div class="calendar">
          <div class="calendar__nav">
            <button type="button" id="prev-month" class="btn btn--ghost">＜</button>
            <div id="month-label" class="calendar__label"></div>
            <button type="button" id="next-month" class="btn btn--ghost">＞</button>
          </div>
          <div class="calendar__weekdays">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="calendar-grid" class="calendar__grid"></div>
        </div>

        <div id="time-section" class="time-section" hidden>
          <h3 id="selected-date-label"></h3>
          <div id="time-slots" class="time-slots"></div>
        </div>
        <div class="step-actions">
          <button type="button" class="btn btn--ghost" data-back="1">戻る</button>
        </div>
      </section>

      <!-- Step 3: メニュー選択 -->
      <section id="step-3" class="step">
        <h3>メニューを選択してください</h3>
        <div id="menu-options" class="menu-options"></div>
        <div class="step-actions">
          <button type="button" class="btn btn--ghost" data-back="2">戻る</button>
          <button type="button" id="to-step-4" class="btn" disabled>次へ</button>
        </div>
      </section>

      <!-- Step 4: お客様情報 -->
      <section id="step-4" class="step">
        <h3>お客様情報を入力してください</h3>
        <div class="summary" id="booking-summary"></div>
        <form id="customer-form">
          <label>
            お名前
            <input type="text" name="name" required autocomplete="name" placeholder="山田 太郎" />
          </label>
          <label>
            電話番号
            <input type="tel" name="phone" required autocomplete="tel" placeholder="09012345678" />
          </label>
          <div class="step-actions">
            <button type="button" class="btn btn--ghost" data-back="3">戻る</button>
            <button type="submit" class="btn">予約する</button>
          </div>
        </form>
        <p id="submit-error" class="message message--error" hidden></p>
      </section>
    </div>

    <div id="done-screen" class="screen" hidden>
      <p class="message message--success">
        仮予約を受け付けました。<br />
        LINEにも確認メッセージをお送りしました。<br />
        店舗からの確定連絡をお待ちください。
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
